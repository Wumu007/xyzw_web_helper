name: Build Android APK

# 打包安卓 APK（云端构建，产物在 Actions Artifacts 中下载；失败时日志提交到 ci-logs 分支以便诊断）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write   # 失败时需要推送日志分支

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build-output.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-helper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Commit build log for diagnosis
        if: failure()
        run: |
          tail -n 400 build-output.log > build-error.log || echo "no log captured" > build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -B ci-logs
          git add build-error.log
          git commit -m "ci: 记录 APK 构建失败日志"
          git push origin ci-logs --force
