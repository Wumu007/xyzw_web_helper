name: Build Android APK

# 打包安卓 APK（云端构建，产物在 Actions Artifacts 中下载；失败时日志提交到 ci-logs 分支以便诊断）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write   # 失败时需要推送日志分支

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK (shell, 不依赖第三方 action)
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "下载 Android 命令行工具..."
            curl -sSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "Android SDK 就绪：$SDK"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon 2>&1 | tee build-output.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyzw-helper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Commit build log for diagnosis
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            tail -n 400 build-output.log > build-error.log
          else
            echo "build-output.log 不存在（构建步骤未执行或提前失败）" > build-error.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f build-error.log
          git commit -m "ci: APK 构建失败日志" || true
          git push origin ci-logs --force
