plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wumu007.xyzwhelper'
    compileSdk 35

    defaultConfig {
        applicationId "com.wumu007.xyzwhelper"
        minSdk 24          // Android 7.0+，覆盖主流机型
        targetSdk 35
        versionCode 2      // v1.1.0：应用改名「快乐咸鱼」+ 移动端适配 + 密钥门禁
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 对齐 Kotlin stdlib 版本，避免 appcompat 依赖链带来的 jdk7/jdk8 重复类问题
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
