plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wumu007.xyzwhelper'
    compileSdk 35

    defaultConfig {
        applicationId "com.wumu007.xyzwhelper"
        minSdk 24          // Android 7.0+，覆盖主流机型
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
