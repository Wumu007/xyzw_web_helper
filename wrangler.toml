# Cloudflare Pages 项目专用配置（经典 Pages，非 Workers 模型）
# 注意：Pages 的 wrangler.toml 只支持 Pages 字段，
#   包含 main / [assets] 等 Workers 字段会导致配置被判无效并被忽略。
name = "xyzw-web-helper"
compatibility_date = "2026-11-01"

# Vite 构建产物目录（与 Pages 控制台构建配置一致）
pages_build_output_dir = "./dist"

# Functions 目录约定：仓库根目录 functions/ 自动编译为 Pages Functions
#   functions/api/verify-key.js -> POST /api/verify-key
# KV 绑定（ACCESS_KV）在 Cloudflare 控制台：
#   项目 Settings -> Functions -> KV namespace bindings 中配置，
#   本文件不声明 kv_namespaces，避免覆盖控制台绑定。
